# deploy.yml - דפלוי אוטומטי בכל push ל-main
#
# שני jobs *עצמאיים* כדי שכישלון באחד לא יחסום את השני:
#   1. deploy-worker   - מעלה את ה-Worker (mia-shipping-api) ל-Cloudflare
#   2. deploy-frontend - בונה ומעלה את ה-Frontend ל-Cloudflare Pages
#
# סודות שצריך להגדיר ב-GitHub (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  - API Token מ-Cloudflare Dashboard
#   CLOUDFLARE_ACCOUNT_ID - מזהה החשבון (מופיע ב-Cloudflare Dashboard)
#
# איך יוצרים API Token:
#   1. Cloudflare Dashboard → My Profile → API Tokens
#   2. Create Token → "Edit Cloudflare Workers" template
#   3. הוסיפי הרשאה נוספת: Cloudflare Pages - Edit

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  # ===== Backend (Cloudflare Worker) =====
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy Worker to Cloudflare
        # משתמשים ב-wrangler שמותקן מקומית ב-worker/node_modules
        run: ./node_modules/.bin/wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ===== Frontend (React + Vite) =====
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client
        env:
          # URL של ה-Worker החי ב-Cloudflare
          VITE_API_BASE_URL: https://mia-shipping-api.edrizohar2.workers.dev/api

      - name: Deploy frontend to Cloudflare Pages
        # משתמשים ב-wrangler@4 ל-Pages (כפי שנדרש על ידי Cloudflare Pages CLI)
        run: npx --yes wrangler@4 pages deploy dist --project-name mia-shipping-frontend --commit-dirty=true
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
