# הגדרות Cloudflare Worker - מערכת משלוחים מייה
# שם ה-Worker שיופיע ב-Cloudflare. ה-URL יהיה בערך: mia-shipping-api.<account>.workers.dev
name = "mia-shipping-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# חיבור למסד הנתונים D1.
# binding = השם שדרכו ניגשים ל-DB בקוד (c.env.DB)
# database_id - יוחלף בערך האמיתי אחרי `wrangler d1 create mia-shipping`.
# במצב local (wrangler dev / --local) הערך הזה לא בשימוש - נוצר DB מקומי אוטומטית.
[[d1_databases]]
binding = "DB"
database_name = "mia-shipping"
database_id = "0f38caa6-b087-42a5-b4b7-41e0431d431f"
migrations_dir = "migrations"

# משתני סביבה לא-סודיים (סודות מוגדרים דרך `wrangler secret put`)
[vars]
ORIAN_MODE = "mock"
ORIAN_BASE_URL = "https://disapiTest.orian.com"
# הערה: JWT_SECRET הוא סוד ולא מוגדר כאן.
#   - בפרודקשן: הוגדר דרך `wrangler secret put JWT_SECRET`
#   - בפיתוח מקומי: יושב בקובץ .dev.vars (שלא נכנס ל-Git)
