# הגדרות Cloudflare Worker - מערכת משלוחים מייה
# שם ה-Worker שיופיע ב-Cloudflare. ה-URL יהיה בערך: mia-shipping-api.<account>.workers.dev
name = "mia-shipping-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# חיבור למסד הנתונים D1.
# binding = השם שדרכו ניגשים ל-DB בקוד (c.env.DB)
# database_id - יוחלף בערך האמיתי אחרי `wrangler d1 create mia-shipping`.
# במצב local (wrangler dev / --local) הערך הזה לא בשימוש - נוצר DB מקומי אוטומטית.
[[d1_databases]]
binding = "DB"
database_name = "mia-shipping"
database_id = "0f38caa6-b087-42a5-b4b7-41e0431d431f"
migrations_dir = "migrations"

# משתני סביבה לא-סודיים (סודות מוגדרים דרך `wrangler secret put`)
[vars]
ORIAN_MODE = "live"
# "live" = קריאות אמיתיות ל-API של אוריין (כרגע מול סביבת האמת disapi)
# "mock" = הדמיה מקומית בלי לקרוא לאוריין
# כתובת ה-API של אוריין (מתוך מסמך ה-API הרשמי של אוריין):
#   סביבת טסט:  https://disapiTest.orian.com
#   סביבת אמת:  https://disapi.orian.com
ORIAN_BASE_URL = "https://disapi.orian.com"
# ORIAN_CONSIGNEE = מספר ה-Consignee (מזהה החשבון) של מייה אצל אוריין.
#   זהו משתנה *גלוי* (לא סוד) כדי שאפשר יהיה לראות ולוודא את הערך בקלות.
#   הוא מספר חשבון, לא סיסמה — ולכן מוגדר כאן ולא דרך `wrangler secret`.
ORIAN_CONSIGNEE = "1363866"
# הערה: JWT_SECRET, ORIAN_USERNAME, ORIAN_PASSWORD הם סודות.
#   - בפרודקשן: הוגדרו דרך `wrangler secret put <NAME>`
#   - בפיתוח מקומי: יושבים בקובץ .dev.vars (שלא נכנס ל-Git)
